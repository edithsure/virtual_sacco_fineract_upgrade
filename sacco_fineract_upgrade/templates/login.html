{% extends "base.html" %}{% block title %}Sign in | Mwangaza SACCO{% endblock %}
{% block content %}<section class="auth-section"><div class="auth-card"><div class="auth-symbol">M</div><div class="eyebrow dark-eyebrow text-center">WELCOME BACK</div><h1>Good to see you.</h1><p class="auth-subtitle">Sign in to continue your financial journey.</p>
<form method="post"><div class="mb-3"><label class="form-label">Email address</label><input class="form-control" type="email" name="email" required autocomplete="email" placeholder="you@example.com"></div><div class="mb-4"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required autocomplete="current-password" placeholder="Your password"></div><button class="btn btn-primary-dark w-100 btn-lg rounded-pill">Sign in <span>→</span></button></form>
<p class="auth-foot">New to Mwangaza? <a href="{{ url_for('register') }}">Create an account</a></p></div></section>{% endblock %}
