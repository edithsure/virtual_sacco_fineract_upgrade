{% extends "base.html" %}{% block title %}Join Mwangaza SACCO{% endblock %}
{% block content %}<section class="auth-section"><div class="auth-card"><div class="auth-symbol">M</div><div class="eyebrow dark-eyebrow text-center">BECOME A MEMBER</div><h1>Start something brighter.</h1><p class="auth-subtitle">Create your account in just a few steps.</p>
<form method="post"><div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="full_name" required autocomplete="name" placeholder="Your full name"></div><div class="mb-3"><label class="form-label">Email address</label><input class="form-control" type="email" name="email" required autocomplete="email" placeholder="you@example.com"></div><div class="mb-4"><label class="form-label">Create password</label><input class="form-control" type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"><div class="form-text">Use a unique password you do not use elsewhere.</div></div><button class="btn btn-primary-dark w-100 btn-lg rounded-pill">Create my account <span>→</span></button></form>
<p class="auth-foot">Already a member? <a href="{{ url_for('login') }}">Sign in</a></p></div></section>{% endblock %}
